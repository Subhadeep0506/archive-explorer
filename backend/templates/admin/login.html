{% extends "admin/base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center px-4 relative overflow-hidden">
    <!-- Floating orbs for visual interest -->
    <div class="absolute top-20 left-20 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob"></div>
    <div class="absolute top-40 right-20 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-40 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-4000"></div>
    
    <!-- Theme Toggle -->
    <button 
        onclick="toggleTheme()" 
        class="absolute top-8 right-8 glass-card p-3 rounded-xl hover:scale-110 transition-transform duration-200 group z-10"
        aria-label="Toggle theme"
    >
        <svg class="w-6 h-6 text-gray-800 dark:text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path class="dark:hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            <path class="hidden dark:block" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
    </button>
    
    <div class="max-w-md w-full space-y-8 relative z-10">
        <!-- Logo/Brand -->
        <div class="text-center">
            <div class="inline-block glass-card p-4 rounded-2xl mb-4">
                <svg class="w-16 h-16 mx-auto text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-5xl font-bold text-gray-900 dark:text-white mb-2 tracking-tight">Arxiver</h1>
            <h2 class="text-xl font-medium text-gray-600 dark:text-gray-300">Admin Portal</h2>
        </div>

        <!-- Login Form -->
        <div class="glass-card shadow-2xl rounded-2xl p-8">
            {% if error %}
            <div class="mb-6 bg-red-500/10 border border-red-500/30 dark:border-red-500/40 text-red-700 dark:text-red-400 px-4 py-3 rounded-xl backdrop-blur-sm" role="alert">
                <p class="font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        Username
                    </label>
                    <input 
                        type="text" 
                        name="username" 
                        id="username" 
                        required
                        autofocus
                        class="w-full px-4 py-3 bg-white/50 dark:bg-gray-800/50 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
                        placeholder="admin"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        required
                        class="w-full px-4 py-3 bg-white/50 dark:bg-gray-800/50 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
                        placeholder="••••••••"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 dark:from-blue-500 dark:to-blue-600 dark:hover:from-blue-600 dark:hover:to-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg hover:shadow-xl transform hover:scale-[1.02]"
                >
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-gray-600 dark:text-gray-400 glass-card px-4 py-2 rounded-lg inline-block">
            Default: <span class="font-mono font-semibold">admin / admin</span>
        </p>
    </div>
</div>

<style>
    @keyframes blob {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    
    .animate-blob {
        animation: blob 7s infinite;
    }
    
    .animation-delay-2000 {
        animation-delay: 2s;
    }
    
    .animation-delay-4000 {
        animation-delay: 4s;
    }
</style>
{% endblock %}
